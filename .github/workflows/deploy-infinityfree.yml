
name: Deploy PersonalHUB to InfinityFree

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "app/**"
      - ".github/workflows/deploy-infinityfree.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personalhub-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend and Backend
    if: ${{ vars.FTP_PUBLIC_DIR != '' && vars.FTP_APP_DIR != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate FTP Configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PUBLIC_DIR: ${{ vars.FTP_PUBLIC_DIR }}
          FTP_APP_DIR: ${{ vars.FTP_APP_DIR }}
        run: |
          set -eu

          for value in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_PUBLIC_DIR FTP_APP_DIR; do
            if [ -z "$(printenv "$value")" ]; then
              echo "::error::$value is missing."
              exit 1
            fi
          done

          for directory in "$FTP_PUBLIC_DIR" "$FTP_APP_DIR"; do
            case "$directory" in
              /*|*..*)
                echo "::error::Invalid FTP directory."
                exit 1
                ;;
              */) ;;
              *)
                echo "::error::Directory must end with /"
                exit 1
                ;;
            esac
          done

          if [ "$FTP_PUBLIC_DIR" = "$FTP_APP_DIR" ]; then
            echo "::error::Frontend and backend directories must differ."
            exit 1
          fi

      # FRONTEND: personalhub.my.id
      - name: Deploy Portfolio
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          protocol: ftp
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: ${{ vars.FTP_PUBLIC_DIR }}
          state-name: .personalhub-portfolio-state.json
          exclude: |
            **/.git*
            **/.github/**

      # BACKEND: app.personalhub.my.id
      - name: Deploy Backend and Admin
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          protocol: ftp
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./app/
          server-dir: ${{ vars.FTP_APP_DIR }}
          state-name: .personalhub-backend-state.json
          exclude: |
            **/.git*
            **/.github/**
            config/.env
            **/.env
            assets/uploads/images/**
            assets/uploads/videos/**
            assets/uploads/files/**
